<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16.png" />
    <link rel="shortcut icon" href="%BASE_URL%favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <!-- maximum-scale=1/user-scalable=no stop native pinch-to-zoom on the
         whole page. Without this, a two-finger pinch on the genetics tree
         canvas (which implements its own pinch-zoom via touch-action:none +
         pointer events) can still get read as the OS/browser's native page
         zoom instead - touch-action:none isn't reliably honored for the
         pinch gesture specifically on every mobile browser. Once native
         zoom kicks in, it reveals area outside .root's own painted
         background (html/body have none set, so it's the browser's plain
         white default) - worse the further out you zoom. Disabling native
         zoom site-wide is safe here since the one view that needs zoom
         (the tree) already has its own in-app implementation. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#241811" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SporeDesk" />
    <meta name="description" content="Lineage and inventory tracker for mushroom cultivation." />
    <meta property="og:title" content="SporeDesk" />
    <meta property="og:description" content="Lineage and inventory tracker for mushroom cultivation." />
    <meta property="og:image" content="%BASE_URL%og-image.png" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>SporeDesk</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
